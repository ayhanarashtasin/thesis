[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rahc-lora"
version = "0.1.0.dev0"
description = "RAHC-LoRA continual reinforcement learning research platform"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = {file = "LICENSE"}
authors = [{name = "RAHC-LoRA contributors"}]
dependencies = [
  "absl-py>=2.1,<3",
  "accelerate>=1.0,<2",
  "datasets>=3.0,<5",
  "hydra-core>=1.3.2,<1.4",
  "immutabledict>=4.2,<5",
  "langdetect>=1.0.9,<2",
  "nltk>=3.9,<4",
  "numpy>=1.26,<3",
  "pandas>=2.2,<4",
  "peft>=0.13,<1",
  "psutil>=6,<8",
  "pyarrow>=18,<26",
  "safetensors>=0.4,<1",
  "scikit-learn>=1.5,<2",
  "scipy>=1.13,<2",
  "torch>=2.4,<3",
  "transformers>=4.45,<5",
  "trl>=0.11,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2",
  "pre-commit>=3.8,<5",
  "pytest>=8.3,<9",
  "pytest-cov>=5,<8",
  "ruff>=0.7,<1",
  "types-PyYAML>=6.0,<7",
]

[project.scripts]
rahc-lora = "rahc_lora.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]
extend-exclude = [".cache"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["rahc_lora"]
mypy_path = "src"
ignore_missing_imports = true
no_site_packages = true
warn_unused_ignores = true
